<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Wishes Sender</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ AUTH SECTION ============ -->
  <div id="auth-section" class="container">
    <h1>🎂 Birthday Wishes Sender</h1>
    <p class="subtitle">Sign in to manage your birthday contacts</p>

    <div id="login-form" class="card">
      <h2 id="auth-title">Sign In</h2>
      <form id="auth-form">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />

        <button type="submit" id="auth-btn">Sign In</button>
      </form>
      <p id="auth-toggle">
        Don't have an account? <a href="#" id="toggle-link">Sign Up</a>
      </p>
      <p id="auth-error" class="error"></p>
    </div>
  </div>

  <!-- ============ APP SECTION ============ -->
  <div id="app-section" class="container hidden">
    <header>
      <h1>🎂 Birthday Wishes Sender</h1>
      <div class="header-right">
        <span id="user-email"></span>
        <button id="sign-out-btn" class="btn-secondary">Sign Out</button>
      </div>
    </header>

    <!-- Add / Edit Contact Form -->
    <div class="card">
      <h2 id="form-title">Add a Birthday Contact</h2>
      <form id="contact-form">
        <input type="hidden" id="edit-id" value="" />

        <label for="contact-name">Name</label>
        <input type="text" id="contact-name" placeholder="Jane Doe" required />

        <label for="contact-email">Email</label>
        <input type="email" id="contact-email" placeholder="jane@example.com" required />

        <label for="contact-birthday">Birthday</label>
        <input type="date" id="contact-birthday" required />

        <label for="wish-message">Birthday Wish Message</label>
        <textarea id="wish-message" rows="3" placeholder="Happy Birthday, Jane! 🎉 Wishing you a wonderful year ahead!"></textarea>

        <div class="form-actions">
          <button type="submit" id="save-btn">Add Contact</button>
          <button type="button" id="cancel-edit-btn" class="btn-secondary hidden">Cancel</button>
        </div>
      </form>
    </div>

    <!-- Contact List -->
    <div class="card">
      <h2>Your Birthday Contacts</h2>
      <div id="contacts-list">
        <p class="placeholder">No contacts yet. Add one above!</p>
      </div>
    </div>

    <!-- Send Wishes Today -->
    <div class="card">
      <h2>🎉 Today's Birthdays</h2>
      <div id="todays-birthdays">
        <p class="placeholder">No birthdays today.</p>
      </div>
    </div>
  </div>

  <!-- Firebase SDK (from CDN for vanilla JS) -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
